# Sighthound SAST (dev / CI)
# https://corgea.com/sighthound
# Not shipped in the plugin ZIP — local + GitHub Actions only.
#
# Note: Sighthound 1.0 has no native SARIF (text|json|csv only). We emit JSON
# and convert via scripts/sighthound-json-to-sarif.js for Code Scanning.

name: Sighthound

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    name: Sighthound scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false

      - name: Install Sighthound
        run: cargo install --git https://github.com/Corgea/Sighthound --tag 1.0

      - name: Discover scan targets
        id: targets
        run: |
          paths=""
          for d in includes src; do
            if [ -d "$d" ]; then
              paths="$paths $d"
            fi
          done
          paths=$(echo "$paths" | xargs)
          if [ -z "$paths" ]; then
            echo "No includes/ or src/ directory — nothing to scan."
            echo "paths=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "paths=$paths" >> "$GITHUB_OUTPUT"
          echo "Scanning: $paths"

      - name: Run Sighthound (text)
        id: scan_text
        if: steps.targets.outputs.paths != ''
        continue-on-error: true
        run: |
          fail=0
          for d in ${{ steps.targets.outputs.paths }}; do
            echo "::group::sighthound $d"
            sighthound "$d" || fail=1
            echo "::endgroup::"
          done
          exit $fail

      - name: Run Sighthound (JSON → SARIF)
        if: steps.targets.outputs.paths != ''
        run: |
          for d in ${{ steps.targets.outputs.paths }}; do
            safe=$(echo "$d" | tr '/' '-')
            sighthound --output-format json "$d" > "sighthound-${safe}.json"
            node scripts/sighthound-json-to-sarif.js "sighthound-${safe}.json" "sighthound-${safe}.sarif"
          done

      - name: Upload SARIF (includes)
        if: always() && hashFiles('sighthound-includes.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: sighthound-includes.sarif
          category: sighthound-includes

      - name: Upload SARIF (src)
        if: always() && hashFiles('sighthound-src.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: sighthound-src.sarif
          category: sighthound-src

      - name: Fail when findings or scan errors
        if: steps.scan_text.outcome == 'failure'
        run: |
          echo "Sighthound reported findings or failed. Review the scan step / Security tab."
          exit 1
